<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="robots" content="noindex,nofollow" />
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:transparent}
  body{width:728px;height:90px;display:flex;align-items:center;justify-content:center}
  a{display:block;width:100%;height:100%;text-decoration:none;color:inherit;position:relative;
    background:linear-gradient(90deg,#1a0d05 0%,#2d1508 50%,#1a0d05 100%);
    background-size:cover;background-position:center;
    border-radius:8px;overflow:hidden}
  .bg{position:absolute;inset:0;background-image:url('/aff/exitlag-bg.webp');
    background-size:cover;background-position:center;opacity:.5}
  .content{position:relative;z-index:1;padding:0 28px;height:100%;
    display:flex;align-items:center;justify-content:space-between;gap:20px}
  .left{display:flex;flex-direction:column;gap:2px}
  .logo{height:20px;width:auto;margin-bottom:2px}
  .headline{font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 4px rgba(0,0,0,.5);
    line-height:1.2;white-space:nowrap}
  .desc{font-size:11px;color:rgba(255,255,255,.65);line-height:1.2;white-space:nowrap}
  .cta{flex-shrink:0;padding:9px 20px;border-radius:6px;background:#C42121;
    color:#fff;font-size:12px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
</style>
</head>
<body>
  <a href="https://www.exitlag.com/refer/10344555" target="_blank" rel="noopener sponsored">
    <div class="bg"></div>
    <div class="content">
      <div class="left">
        <img src="/aff/exitlag-logo.svg" alt="ExitLag" class="logo" />
        <span class="headline">No more disconnects</span>
        <span class="desc">3-day free trial · No credit card</span>
      </div>
      <span class="cta">Try now</span>
    </div>
  </a>
</body>
</html>
